<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- ✅ Basic SEO -->
    <title>SK Foodz | Premium Dried Fruits, Nut Butters & Healthy Snacks</title>
    <meta
      name="description"
      content="SK Foodz brings you premium-quality dried fruits, nut butters, muesli bars, and healthy snacks made with natural ingredients. Taste the goodness of nature — shop online now!"
    />
    <meta
      name="keywords"
      content="SK Foodz, dried fruits, nut butter, healthy snacks, muesli bars, natural foods, buy dried fruits online, healthy food India"
    />
    <meta name="author" content="SK Foodz" />
    <link rel="canonical" href="https://skfoodz.com/" />

    <!-- ✅ Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- ✅ Open Graph (for Facebook, WhatsApp, LinkedIn) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="SK Foodz | Natural & Healthy Snacks" />
    <meta
      property="og:description"
      content="Discover SK Foodz — a brand dedicated to pure, healthy, and delicious dried fruits, nut butters, and snacks made with love."
    />
    <meta property="og:url" content="https://skfoodz.com/" />
    <meta property="og:image" content="https://skfoodz.com/og-image.jpg" /> <!-- optional: use your hero image -->

    <!-- ✅ Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SK Foodz | Premium Natural Snacks" />
    <meta
      name="twitter:description"
      content="Buy 100% natural dried fruits, nut butters, and snacks from SK Foodz. Delicious and healthy — shop now!"
    />
    <meta name="twitter:image" content="https://skfoodz.com/og-image.jpg" />

    <!-- ✅ Structured Data (helps Google understand your brand) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "SK Foodz",
      "url": "https://skfoodz.com/",
      "logo": "https://skfoodz.com/logo.png",
      "sameAs": [
        "https://www.facebook.com/skfoodz",
        "https://www.instagram.com/skfoodz",
        "https://www.linkedin.com/company/skfoodz"
      ],
      "description": "Premium natural dried fruits, nut butters, and healthy snacks made with care. Taste, nutrition, and trust from SK Foodz.",
      "contactPoint": {
        "@type": "ContactPoint",
        "telephone": "+91-9712935176",
        "contactType": "customer service",
        "areaServed": "IN"
      }
    }
    </script>

    <!-- ✅ Robots Instruction -->
    <meta name="robots" content="index, follow" />

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
